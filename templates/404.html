{% extends "base.html" %}

{% block title %}Page Not Found - Kumar Store{% endblock %}

{% block content %}
<div class="container my-5 text-center">
  <div class="py-5">
    <div class="display-1 fw-bold text-success mb-3">404</div>
    <h1 class="h3 fw-bold mb-2">Oops! Grocery Item or Page Not Found</h1>
    <p class="text-muted small mb-4">The page or product you are looking for might have been moved or is currently unavailable.</p>
    <a href="{{ url_for('shop.index') }}" class="btn btn-success fw-bold px-4 py-2 rounded-pill">
      <i class="bi bi-house-door me-1"></i> Return to Kumar Store
    </a>
  </div>
</div>
{% endblock %}
